# Every default number Hearth uses. Each leaf is {value, source, confirmed}.
# Shared and append-only: any lane may add keys; nobody edits another lane's keys.
# confirmed: false means our own call or a placeholder awaiting a real source.

models:
  interpreter: {value: claude-haiku-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  guard: {value: claude-haiku-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  agent: {value: claude-sonnet-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  vision: {value: claude-sonnet-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  subagent: {value: claude-haiku-5-5, source: "our call: layer subagents only call tools and summarize; speed", confirmed: false}
  agent_effort: {value: medium, source: "our call: survey latency target ~30 s", confirmed: false}
  subagent_effort: {value: low, source: "our call: survey latency target ~30 s", confirmed: false}
  vision_effort: {value: low, source: "our call: one short visual answer per call", confirmed: false}

decision:
  margin_h: {value: 12, source: "hearth-spec v5 §4", confirmed: true}
  low_backup_h: {value: 4, source: "hearth-spec v5 §4", confirmed: true}
