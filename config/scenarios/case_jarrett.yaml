# Replay of one documented case from Hurricane Beryl: a 64-year-old woman in Spring, TX, who used a wheelchair and a
# feeding tube, died of heat on July 11, 2024, the fourth day without power, while her sister kept the feeding pump
# charged; her sister said she was on the utility's emergency list; power returned Tuesday, July 16 (Harris County
# Medical Examiner, as reported by ABC13 Houston and The Texas Tribune, July 2024).
# The patient record below is a synthetic stand-in: location is the ZIP area, not the home; backup hours, supplier and
# phone status are our assumptions. The outcome under Hearth is simulated and is not a claim about what would have happened.
name: case_jarrett
label: "replay of a documented case; outcome under Hearth is simulated (Spring, TX, Hurricane Beryl, July 2024)"
start: "2024-07-08T06:00:00Z"
end: "2024-07-19T00:00:00Z"
center: [30.06, -95.38]
weather_from: beryl_2024
# this home: dark from landfall (09:00 UTC Jul 8) until Tuesday Jul 16 (hour not reported; noon CDT = 17:00 UTC assumed)
curve: [[0, 0.0], [3, 0.0], [3.5, 1.0], [203, 1.0], [203.5, 0.0], [258, 0.0]]
snapshot_every_ticks: 1
patients:
