# Every default number Hearth uses. Each leaf is {value, source, confirmed}.
# Shared and append-only: any lane may add keys; nobody edits another lane's keys.
# confirmed: false means our own call or a placeholder awaiting a real source.

models:
  interpreter: {value: claude-haiku-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  guard: {value: claude-haiku-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  agent: {value: claude-sonnet-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  vision: {value: claude-sonnet-5-5, source: "design: model access confirmed Nov 13", confirmed: true}
  subagent: {value: claude-haiku-5-5, source: "our call: layer subagents only call tools and summarize; speed", confirmed: false}
  agent_effort: {value: medium, source: "our call: survey latency target ~30 s", confirmed: false}
  subagent_effort: {value: low, source: "our call: survey latency target ~30 s", confirmed: false}
  dispatch: {value: claude-sonnet-5-5, source: "our call: orders open help requests on every new request; speed over depth", confirmed: false}
  vision_effort: {value: low, source: "our call: one short visual answer per call", confirmed: false}

decision:
  margin_h: {value: 12, source: "hearth-spec v5 §4", confirmed: true}
  low_backup_h: {value: 4, source: "hearth-spec v5 §4", confirmed: true}
  urgent_h: {value: 1, source: "our call", confirmed: false}
  hysteresis_ticks: {value: 2, source: "hearth-spec v5 §4", confirmed: true}

temperature:
  default_heat_tc_h: {value: 8, source: "hearth-spec v5 §5 (heuristic)", confirmed: true}
  default_cold_tc_h: {value: 12, source: "hearth-spec v5 §5 (heuristic)", confirmed: true}
  unsafe_heat_index_c: {value: 32, source: "hearth-spec v5 §5 (NWS extreme caution band)", confirmed: true}
  unsafe_cold_c: {value: 16, source: "hearth-spec v5 §5", confirmed: true}
  setpoint_c: {value: 22, source: "hearth-spec v5 §5", confirmed: true}

sim:
  tick_minutes: {value: 30, source: "hearth-spec v5 §9.1", confirmed: true}
  horizon_h: {value: 12, source: "hearth-spec v5 §9.1", confirmed: true}
  detection_delay_min: {value: 5, source: "hearth-spec v5 §9.1", confirmed: true}
  snapshot_every_ticks: {value: 6, source: "our call (lane S): 3-hourly map frames keep a county run's snapshots near 300 MB; scenarios may override", confirmed: false}

risk_weight:
  oxygen: {value: 3, source: "hearth-spec v5 §3.2", confirmed: true}
  ventilator: {value: 5, source: "hearth-spec v5 §3.2", confirmed: true}
  home_dialysis: {value: 2, source: "hearth-spec v5 §3.2", confirmed: true}
  feeding_gastric: {value: 1, source: "hearth-spec v5 §3.2", confirmed: true}
  feeding_jejunal: {value: 2, source: "hearth-spec v5 §3.2", confirmed: true}

population:
  complete_profile_rate: {value: 0.5, source: "hearth-spec v5 §3.2", confirmed: true}
  reachable_phone_rate: {value: 0.7, source: "hearth-spec v5 §3.2", confirmed: true}
  costar_building_share: {value: 0.35, source: "hearth-spec v5 §3.2", confirmed: true}
  supplier_shares: {value: [0.40, 0.35, 0.25], source: "hearth-spec v5 §3.2", confirmed: true}
  device_counts: {value: {oxygen: 51695, ventilator: 5551, home_dialysis: 5366, feeding_pump: 1248}, source: "Texas, calendar 2024, Medicare. CMS DME by Geography and Service (beneficiaries, rental + purchase): oxygen E1390; ventilator E0465+E0466+E0467; feeding pump B9002. Home dialysis is not DME: CMS Medicare Dialysis Facilities FY2026, Texas, sum over facilities of Medicare patients alive 12/31/2024 x (% home hemodialysis + % cycler PD). Patients are split by these shares; see docs/sim-notes.md", confirmed: false}
  # lane S additions
  backup_h: {value: {oxygen: [4, 48], ventilator: [8, 24], feeding_pump: [8, 24]}, source: "our call: uniform range of hours the device runs on what is at home (cylinders, batteries). Placeholder", confirmed: false}
  dialysis_due_within_days: {value: 2, source: "our call: the next home dialysis session is due uniformly within this many days of the outage; at risk once it passes in a dark home without reaching care", confirmed: false}
  mobility_mix: {value: {walks: 0.35, walks_with_help: 0.25, wheelchair_manual: 0.15, wheelchair_power: 0.15, bedbound: 0.10}, source: "our call; placeholder", confirmed: false}
  temp_sensitive_mix: {value: {heat: 0.45, cold: 0.05, both: 0.20, none: 0.30}, source: "our call: most are older Medicare beneficiaries; placeholder", confirmed: false}
  feeding_jejunal_share: {value: 0.2, source: "our call; placeholder", confirmed: false}
  patients_per_building: {value: 3, source: "our call: synthetic residents placed in each surveyed CoStar building", confirmed: false}
  building_match_km: {value: 2.0, source: "our call: a building resident moves to a surveyed building only if one is this close", confirmed: false}

phone_tree:
  unreachable_rate: {value: 0.414, source: "Broome County: 24 of 58 unreachable", confirmed: true}
  staff: {value: 6, source: "placeholder; replace from interviews", confirmed: false}
  calls_per_staff_hour: {value: 12, source: "placeholder; replace from interviews", confirmed: false}

travel:
  detour_factor: {value: 1.4, source: "hearth-spec v5 §9.1", confirmed: true}
  speed_kmh: {value: 40, source: "hearth-spec v5 §9.1", confirmed: true}

building:
  service_base_min: {value: 10, source: "hearth-spec v5 §9.1", confirmed: true}
  service_min_per_floor_no_elevator: {value: 4, source: "hearth-spec v5 §9.1", confirmed: true}
  # building time-constant heuristic (Task 3); a labeled heuristic, not a thermal model
  tc:
    construction: {value: {masonry: 1.3, concrete: 1.3, steel: 1.0, wood: 0.9, unknown: 1.0}, source: "our heuristic: heavier walls hold temperature longer", confirmed: false}
    roof: {value: {light: 1.15, medium: 1.0, dark: 0.85}, source: "our heuristic: dark roofs absorb more sun", confirmed: false}
    shade_per_tree_cover: {value: 0.3, source: "our heuristic: shade = 1 + 0.3 * tree cover fraction", confirmed: false}
    age: {value: {before_1980: 0.9, from_1980: 1.0, from_2000: 1.15}, source: "our heuristic: energy codes tightened from 1980 and 2000", confirmed: false}
    clamp_h: {value: [3, 24], source: "our heuristic", confirmed: false}

refuge:
  search_radius_km: {value: 15, source: "our call: a short ride across Houston", confirmed: false}
  max_candidates: {value: 3, source: "our call: each uncached candidate costs a 30-60 s survey", confirmed: false}
  elevator_runs_outside_outage: {value: true, source: "team decision Nov 14: a refuge outside the dark area has power, so an elevator seen in its scan is assumed running; a simulated call stands in for a real one", confirmed: false}
  building_answer_valid_h: {value: 6, source: "our call: a building office's answer about power and the elevator counts for this many hours, then the simulated answer applies again; placeholder", confirmed: false}

voice:
  county: {value: Harris County, source: "design: synthetic Harris County patients", confirmed: true}
  min_confidence: {value: 0.7, source: "plan Task V2: an interpreted turn below 0.7 goes to a person", confirmed: false}
  silences_to_escalate: {value: 3, source: "plan Task V2: three empty turns in a row end the call", confirmed: false}
  turn_timeout_s: {value: 7, source: "ElevenLabs default turn_timeout; seconds of caller silence before a turn counts as empty", confirmed: false}
  tts_streaming_optimization: {value: 1, source: "ElevenLabs optimize_streaming_latency 0-4; 3 sounded robotic on the first real call while speech started 0.07 s after text, so quality wins", confirmed: false}
  unfinished_after_min: {value: 5, source: "our call: a registration call with no turn for this long has been hung up (the server is not told), so it is listed for a person", confirmed: false}
  room_lookup_timeout_s: {value: 3, source: "our call: longest wait for the scan's room names when the address is confirmed; after it the room question uses the bedroom wording", confirmed: false}

# ---- lane S (simulation) ----
outage:
  dip_ratio: {value: 0.75, source: "our call: a reading below 75% of both sides' recent max is a data glitch (EAGLE-I near-zero runs and the Jul 8 false dip); plan's 10% rule missed multi-interval runs", confirmed: false}
  dip_window_h: {value: 6, source: "our call: longest glitch run in the Beryl window is under 6 h", confirmed: false}
  onset_fraction: {value: 0.05, source: "our call: the late-onset ramp ends at the first reading above 5% of customers", confirmed: false}

planner:
  depots: {value: {s1: [29.80, -95.45], s2: [29.70, -95.30], s3: [29.95, -95.42]}, source: "our call: synthetic depot locations, one per supplier", confirmed: false}
  stock_per_supplier: {value: 2000, source: "our call: delivery units (cylinders, battery packs) each supplier can send; placeholder", confirmed: false}
  delivery_backup_h: {value: 24, source: "our call: hours of backup one delivery adds; placeholder", confirmed: false}
  destinations: {value: [[29.7069, -95.3972, "Texas Medical Center"], [29.7520, -95.3580, "George R. Brown Convention Center"], [29.6847, -95.4107, "NRG Center"]], source: "our call: approximate locations of a hospital campus and two large shelters; rides end at the nearest", confirmed: false}
  candidates_per_free_crew: {value: 50, source: "our call (speed): only the top needs per free crew are offered each tick", confirmed: false}

# records-only building profiles (hearth/buildings/bulk.py); Vexcel gives roof material, not color
building_records:
  roof_tone_by_material: {value: {membrane: light, metal: light, shingle: medium, tile: medium, gravel: dark, built-up: dark, asphalt: dark}, source: "our call: typical colors; most Houston flat membrane roofs are white TPO", confirmed: false}
  costar_confidence: {value: 0.8, source: "our call: CoStar research fields, not verified on site", confirmed: false}
  costar_inferred_confidence: {value: 0.5, source: "our call: elevator count inferred from 'at least one' or a walk-up flag, not counted", confirmed: false}
  roof_tone_confidence: {value: 0.4, source: "our call: color inferred from material class, no image read", confirmed: false}

sweep:
  crews: {value: [20, 40, 80, 160, 320], source: "user decision Nov 13: 5-80 covered only the start of the curve (about 13 deliveries per crew-day against ~10,000 a day at peak)", confirmed: true}
  seeds: {value: 10, source: "plan Task S4", confirmed: true}

# ---- help loop (slice 2): a resident's own request is dispatched to a crew, with a refuge as the drop-off ----
dispatch:
  refuge_capacity_share: {value: 0.05, source: "user decision Nov 14: a refuge takes this share of its CoStar unit count, at least 1; placeholder", confirmed: false}
  eta_window_min: {value: 15, source: "our call: width of the arrival window shown to a resident; placeholder", confirmed: false}
  offer_timeout_s: {value: 90, source: "our call: an offer a crew does not answer in this time passes to the next crew; placeholder", confirmed: false}
  text_max_age_h: {value: 6, source: "our call: an open help request untouched for this long is not texted when someone else's request changes (keeps rehearsal leftovers quiet)", confirmed: false}
  vehicle_max_item_cm: {value: {car: 60, van: 150, wheelchair_van: 150, ambulance: 100}, source: "our call: longest side of a device each vehicle can carry beside a passenger; placeholder", confirmed: false}

